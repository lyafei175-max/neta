name: iOS Build
type: ios

environment:
  XCODEGEN_VERSION: 2.42.0

scripts:
  - name: Install XcodeGen
    script: |
      brew install xcodegen

  - name: Generate project
    script: |
      cd ios
      xcodegen generate

  - name: Compile check
    script: |
      cd ios
      set +e
      xcodebuild \
        -project NetaL.xcodeproj \
        -scheme NetaL \
        -configuration Debug \
        -destination 'generic/platform=iOS Simulator' \
        CODE_SIGNING_ALLOWED=NO \
        build > compile-log.txt 2>&1
      set -e
      if grep -qE "error:" compile-log.txt; then
        grep -oE "error: .*" compile-log.txt | sort -u | head -40
        exit 1
      fi
      echo "编译通过"

  - name: Build unsigned IPA
    script: |
      cd ios
      chmod +x make-ipa.sh
      ./make-ipa.sh build/NetaL.xcarchive .

artifacts:
  - path: ios/NetaL-unsigned.ipa
    type: file
    name: NetaL-unsigned.ipa

  - path: ios/compile-log.txt
    type: file
    name: compile-log.txt

  - path: ios/archive-log.txt
    type: file
    name: archive-log.txt
