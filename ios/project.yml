name: NetaL

options:
  bundleIdPrefix: com.neta
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Manual

targets:
  NetaL:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: NetaL
        excludes:
          - "**/.DS_Store"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neta.l
        INFOPLIST_FILE: NetaL/Resources/Info.plist
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: NetaL/Resources/NetaL.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
        ENABLE_PREVIEWS: YES

    info:
      path: NetaL/Resources/Info.plist
      properties:
        CFBundleDisplayName: ??L
        CFBundleShortVersionString: "0.1.5"
        CFBundleVersion: "2"
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: ????????,?????????????
        NSBluetoothPeripheralUsageDescription: ??????????
        NSLocationWhenInUseUsageDescription: ????????????
        NSLocationAlwaysAndWhenInUseUsageDescription: ?????????????????
        NSLocationAlwaysUsageDescription: ?????????????????
        UIBackgroundModes:
          - bluetooth-central
        ITSAppUsesNonExemptEncryption: false

schemes:
  NetaL:
    build:
      targets:
        NetaL: all
    run:
      config: Debug
    archive:
      config: Release