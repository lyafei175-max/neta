# XcodeGen 閰嶇疆 鈥斺€?macOS 涓?`xcodegen generate` 鍗冲彲鐢熸垚 NetaL.xcodeproj
#
# 鐩告瘮鎵嬪啓 .xcodeproj锛岃繖鏄洿鍙潬鐨勬柟寮忥紙涓嶉渶瑕佺淮鎶?project.pbxproj锛夈€?# 瀹夎锛歜rew install xcodegen

name: NetaL

options:
  bundleIdPrefix: com.neta
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.3.6"
    CURRENT_PROJECT_VERSION: "15"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Manual

targets:
  NetaL:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: NetaL
        excludes:
          - "**/.DS_Store"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neta.l
        INFOPLIST_FILE: NetaL/Resources/Info.plist
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: NetaL/Resources/NetaL.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
        ENABLE_PREVIEWS: YES

    info:
      path: NetaL/Resources/Info.plist
      properties:
        CFBundleDisplayName: 鍝悞杞︽帶
        CFBundleShortVersionString: "0.3.6"
        CFBundleVersion: "15"
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: 鐢ㄤ簬鎵弿杞﹁締钃濈墮锛屽疄鐜拌繎鍦鸿溅鎺т笌闈犺繎鑷姩瑙ｉ攣
        NSBluetoothPeripheralUsageDescription: 鐢ㄤ簬杩炴帴杞﹁締钃濈墮璁惧
        NSLocationWhenInUseUsageDescription: 鐢ㄤ簬灏嗚溅杈嗕綅缃В鏋愪负鍦板潃
        NSLocationAlwaysAndWhenInUseUsageDescription: 鐢ㄤ簬鍦ㄨ溅杈嗛檮杩戞椂鑷姩鍞ら啋骞惰繛鎺ヨ摑鐗?        NSLocationAlwaysUsageDescription: 鐢ㄤ簬鍦ㄨ溅杈嗛檮杩戞椂鑷姩鍞ら啋骞惰繛鎺ヨ摑鐗?        UIBackgroundModes:
          - bluetooth-central
        ITSAppUsesNonExemptEncryption: false

schemes:
  NetaL:
    build:
      targets:
        NetaL: all
    run:
      config: Debug
    archive:
      config: Release
