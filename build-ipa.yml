name: Build IPA

# ============================================================
#  编译检查 + 打包无签名 IPA
#
#  不需要任何证书或 Secret。直接运行即可。
#
#  公开仓库：macOS runner 免费不限量
#  私有仓库：约 200 分钟/月
#
#  用法：Actions → Build IPA → Run workflow
# ============================================================

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '构建模式'
        required: true
        default: 'compile-only'
        type: choice
        options:
          - compile-only    # 仅编译检查，最快，用于查编译错误
          - ipa             # 编译并导出无签名 IPA
      xcode:
        description: 'Xcode 版本'
        required: false
        default: '15.4'
        type: choice
        options:
          - '15.4'
          - '16.2'
          - 'latest'

jobs:
  build:
    # iOS 编译必须有 macOS —— 唯一硬性要求
    runs-on: macos-latest
    timeout-minutes: 40

    env:
      PROJECT_DIR: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          REQUESTED="${{ github.event.inputs.xcode }}"
          if [ "$REQUESTED" = "latest" ]; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | tail -1)"
          else
            sudo xcode-select -s /Applications/Xcode_${REQUESTED}.app 2>/dev/null || \
            sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | tail -1)"
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          cd $PROJECT_DIR
          xcodegen generate
          echo "--- 工程信息 ---"
          xcodebuild -list -project NetaL.xcodeproj

      # ---------- 编译 ----------
      - name: Compile
        run: |
          cd $PROJECT_DIR
          set +e
          xcodebuild \
            -project NetaL.xcodeproj \
            -scheme NetaL \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > compile-log.txt 2>&1
          set -e

          echo "===== 编译错误 ====="
          if grep -qE "error:" compile-log.txt; then
            grep -E "error:" compile-log.txt | sed 's/^/  /' | head -60
          else
            echo "  无错误"
          fi

          echo ""
          echo "===== 错误去重汇总 ====="
          grep -oE "error: .*" compile-log.txt 2>/dev/null | sort -u | head -40 || true

          echo ""
          echo "===== 警告（前 30 条）====="
          grep -E "warning:" compile-log.txt 2>/dev/null | sed 's/^/  /' | head -30 || echo "  无警告"

      - name: Report compile result
        run: |
          cd $PROJECT_DIR
          {
            echo "## 编译结果"
            echo ""
            if grep -qE "error:" compile-log.txt 2>/dev/null; then
              echo "❌ **编译失败**"
              echo ""
              echo "### 错误列表"
              echo '```'
              grep -oE "error: .*" compile-log.txt | sort -u | head -40
              echo '```'
            else
              echo "✅ **编译通过**"
              echo ""
              echo "全部 Swift 代码编译成功。"
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: ios/compile-log.txt
          retention-days: 7

      # ---------- 导出无签名 IPA ----------
      - name: Archive and export IPA
        if: github.event.inputs.mode == 'ipa'
        run: |
          cd $PROJECT_DIR
          set +e

          xcodebuild \
            -project NetaL.xcodeproj \
            -scheme NetaL \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/NetaL.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive > archive-log.txt 2>&1

          if grep -qE "error:" archive-log.txt; then
            echo "Archive 失败："
            grep -E "error:" archive-log.txt | head -30
            exit 1
          fi

          mkdir -p ipa
          cat > ExportOptions-unsigned.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
              <key>method</key><string>development</string>
              <key>signingStyle</key><string>manual</string>
              <key>signingCertificate</key><string></string>
              <key>provisioningProfiles</key><dict/>
              <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -exportArchive \
            -archivePath build/NetaL.xcarchive \
            -exportOptionsPlist ExportOptions-unsigned.plist \
            -exportPath ipa >> archive-log.txt 2>&1

          set -e
          ls -lh ipa/ || echo "导出目录为空"

      - name: Upload IPA artifact
        if: always() && github.event.inputs.mode == 'ipa'
        uses: actions/upload-artifact@v4
        with:
          name: NetaL-ipa
          path: ios/ipa/*.ipa
          retention-days: 30

      - name: Report IPA result
        if: always()
        run: |
          cd $PROJECT_DIR
          {
            echo ""
            echo "## IPA 打包"
            echo ""
            if [ "${{ github.event.inputs.mode }}" = "ipa" ]; then
              if ls ipa/*.ipa >/dev/null 2>&1; then
                echo "✅ **导出成功**"
                echo ""
                echo '```'
                ls -lh ipa/
                echo '```'
                echo ""
                echo "在页面底部 **Artifacts** 下载 `NetaL-ipa`"
                echo ""
                echo "> 未签名 IPA 无法直接安装，仅用于验证构建流程与打包产物"
              else
                echo "❌ 导出失败，见上方日志"
              fi
            fi
          } >> $GITHUB_STEP_SUMMARY
